<!DOCTYPE html>
<html>
<head>
    <title>World Countries</title>
    <style>
        body {
            font-family: Arial;
            background: #eaf2f8;
            text-align: center;
            padding: 30px;
        }
        h1 {
            color: #154360;
        }
        .box {
            background: white;
            padding: 25px;
            margin: auto;
            max-width: 450px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #bbb;
        }
        a {
            display: block;
            background: #2980b9;
            color: white;
            text-decoration: none;
            padding: 12px;
            margin: 10px;
            border-radius: 5px;
        }
        a:hover {
            background: #154360;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>World Countries</h1>

    <a href="https://en.wikipedia.org/wiki/India">India</a>
    <a href="https://en.wikipedia.org/wiki/United_States">United States</a>
    <a href="https://en.wikipedia.org/wiki/United_Kingdom">United Kingdom</a>
    <a href="https://en.wikipedia.org/wiki/China">China</a>
    <a href="https://en.wikipedia.org/wiki/Japan">Japan</a>
</div>

</body>
</html>
