<!DOCTYPE html>
<html>
<head>
    <title>Lists and Tables</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f7;
            padding: 20px;
        }
        h2 {
            color: #1f618d;
        }
        .box {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #999;
            padding: 12px;
            text-align: center;
        }
        th {
            background: #2874a6;
            color: white;
        }
        tr:nth-child(even) {
            background: #eaf2f8;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Ordered List</h2>
    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ol>

    <h2>Unordered List</h2>
    <ul>
        <li>Python</li>
        <li>Java</li>
        <li>PHP</li>
    </ul>
</div>

<div class="box">
    <h2>Student Details</h2>

    <table>
        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Department</th>
        </tr>
        <tr>
            <td>101</td>
            <td>Ravi</td>
            <td>BCA</td>
        </tr>
        <tr>
            <td>102</td>
            <td>Priya</td>
            <td>MCA</td>
        </tr>
        <tr>
            <td>103</td>
            <td>Kumar</td>
            <td>B.Sc CS</td>
        </tr>
    </table>
</div>

</body>
</html>
